name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  test:
    name: test (locked)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (from lock)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps

      # Assert the migration chain is complete: upgrade a fresh SQLite file to head,
      # then `alembic check` fails if any model change lacks a matching migration.
      - name: Migrations (fresh DB, no drift)
        env:
          DATABASE_URL: "sqlite:///./ci_migrations.db"
        run: |
          alembic upgrade head
          alembic check

      - name: Ruff
        run: ruff check .

      # e2e tests need a browser (Playwright) the default job does not install.
      - name: Pytest
        run: pytest --cov=backend -m "not e2e"

  # Non-blocking early warning: install the unpinned ">=" floors (newest) so we
  # notice if a future release breaks the suite before the lock is refreshed.
  # continue-on-error keeps it from ever turning the required checks red.
  drift:
    name: drift (unpinned, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (unpinned floors)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest --cov=backend -m "not e2e"

name: Bug report
description: Something behaves differently from how it is documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please check the README's accuracy tiers. Several
        behaviours that look like bugs are documented and measured:
        tempo accuracy is unbenchmarked and known weak, and energy,
        danceability and mix points are heuristics with no ground truth.
        Missing authentication is by design; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        1. Ran `python -m backend.scan ~/Music`
        2. Expected ...
        3. Got ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Paste the traceback or server log. Automatically formatted as code.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: "Output of `git rev-parse --short HEAD`"
      placeholder: "bd538e1"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, "Windows (WSL)"]
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.3"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      description: Only if the problem involves the interface or the build.
      placeholder: "22.23.2"
  - type: input
    id: audio
    attributes:
      label: Audio format
      description: Only if the problem involves a specific file. Note ffmpeg is required for m4a, aac and opus.
      placeholder: "mp3, 320kbps"

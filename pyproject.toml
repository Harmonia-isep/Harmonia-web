[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harmonia"
version = "0.1.0"
description = "Local-first music analysis and DJ-assistance tool: BPM, key/scale, energy, danceability, and Camelot-wheel harmonic mixing recommendations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Harmonia-isep" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "sqlalchemy>=2.0.49",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.27",
    "librosa>=0.11.0",
    "numpy>=2.4.4",
    "soundfile>=0.13.1",
    "mutagen>=1.47.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    # starlette's TestClient (used by the client fixture) needs an httpx package.
    "httpx>=0.27",
]
e2e = [
    "playwright>=1.40",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["backend.tests*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "RUF", "ASYNC", "TRY"]
ignore = [
    # The single blind `except Exception` in the analyzer is a deliberate
    # catch-all (BLE001 is not in select anyway; kept to document intent).
    "BLE001",
    # TRY300 (move a return into an else block) does not fit functions with
    # early returns, e.g. artwork.extract_artwork, and reads worse there.
    "TRY300",
]

[tool.ruff.lint.flake8-bugbear]
# Depends()/Query()/etc. in argument defaults is the idiomatic FastAPI pattern,
# not the B008 mutable-default bug. Treat these calls as immutable.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Body",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "e2e: browser-driven end-to-end tests (need Playwright and a browser); excluded from the default CI run via -m \"not e2e\"",
]
